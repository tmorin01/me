---
layout: default
---

<article class="post-article">
  <header class="post-header">
    <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <div class="post-back">
    <a href="{{ '/writing/' | relative_url }}">← All writing</a>
  </div>
</article>
